name: Pokemon TCG Drops Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord test
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -H "User-Agent: PokemonTCGDrops/1.0" \
            -d '{"content":"✅ Pokémon TCG monitor connected!"}' \
            "$WEBHOOK"
