name: Pokemon TCG Drops Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: pokemon-tcg-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install monitor packages
        run: pip install httpx beautifulsoup4

      - name: Check Pokemon TCG retailers
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LOCAL_DISCORD_WEBHOOK_URL: ${{ secrets.LOCAL_DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python monitor.py

      - name: Save product state safely
        if: always()
        shell: bash
        run: |
          if [ ! -f state.json ]; then
            echo "No state.json to save."
            exit 0
          fi

          cp state.json /tmp/pokemon-state.json

          git config user.name "pokemon-tcg-monitor"
          git config user.email "actions@users.noreply.github.com"

          for ATTEMPT in 1 2 3; do
            echo "State save attempt ${ATTEMPT}"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/pokemon-state.json state.json
            git add state.json

            if git diff --cached --quiet; then
              echo "No state changes to save."
              exit 0
            fi

            git commit -m "Update Pokemon TCG monitor state"

            if git push origin HEAD:main; then
              echo "State saved successfully."
              exit 0
            fi

            echo "Main changed while saving state. Retrying..."
            sleep 2
          done

          echo "Monitor completed, but state save was skipped after 3 retries."
          echo "The next run can rebuild state."
          exit 0
